<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Login // Cyber UNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1 class="glitch">CYBER UNO</h1>
      <div class="tagline">ACCESS TERMINAL</div>
    </div>

    <div class="panel">
      <h2 class="neon-text text-center mb-1" style="font-size:1.2rem;">LOGIN</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" required minlength="3" maxlength="20" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required minlength="6" placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">ENTER SYSTEM</button>
      </form>

      <p class="text-center mt-2" style="font-size:0.85rem;color:var(--text-dim);">
        No account? <a href="register.html" style="color:var(--cyan);">Register</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Already logged in?
    getCurrentUser().then(s => { if (s) location.replace('dashboard.html'); });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';
      try {
        await login(
          document.getElementById('username').value,
          document.getElementById('password').value
        );
        showToast('Access granted');
        setTimeout(() => location.href = 'dashboard.html', 400);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'ENTER SYSTEM';
      }
    });
  </script>
</body>
</html>
