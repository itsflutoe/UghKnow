<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Game // Cyber UNO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-table" id="gameTable">
      <div class="opponents" id="opponents"></div>

      <div class="center-area">
        <div class="pile draw-pile" id="drawPile" onclick="onDraw()">DRAW</div>
        <div>
          <div class="pile discard-pile" id="discardPile"></div>
          <div class="text-center mt-1">
            <div class="color-indicator" id="colorInd" style="margin:0 auto;"></div>
          </div>
        </div>
      </div>

      <div id="turnInfo" class="text-center" style="font-size:0.8rem;color:var(--text-dim);">Waiting...</div>

      <div class="hand" id="hand"></div>
    </div>

    <div class="action-bar">
      <button class="btn btn-sm" onclick="location.href='dashboard.html'">MENU</button>
      <button class="btn btn-sm" id="callUnoBtn" onclick="callUno()" style="display:none;">CALL UNO</button>
    </div>

    <button class="uno-btn" id="unoBtn" onclick="callUno()">UNO!</button>
  </div>

  <!-- Color picker -->
  <div id="colorPicker" class="victory-overlay hidden">
    <div class="victory-box">
      <h3 class="neon-text">CHOOSE COLOR</h3>
      <div class="flex" style="justify-content:center;gap:0.8rem;margin-top:1.2rem;">
        <button class="btn" style="background:#ff2a6d;border:none;width:60px;height:60px;" onclick="chooseColor('red')"></button>
        <button class="btn" style="background:#00b4ff;border:none;width:60px;height:60px;" onclick="chooseColor('blue')"></button>
        <button class="btn" style="background:#00ff9f;border:none;width:60px;height:60px;" onclick="chooseColor('green')"></button>
        <button class="btn" style="background:#fcee0a;border:none;width:60px;height:60px;" onclick="chooseColor('yellow')"></button>
      </div>
    </div>
  </div>

  <!-- Victory -->
  <div id="victory" class="victory-overlay hidden">
    <div class="victory-box">
      <h2>VICTORY</h2>
      <p id="winnerName" class="neon-text" style="font-size:1.4rem;margin:0.5rem 0;"></p>
      <p style="color:var(--text-dim);">HAS WON THE GAME</p>
      <div class="menu-grid mt-2">
        <button class="btn btn-primary" onclick="location.href='dashboard.html'">MAIN MENU</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/uno-engine.js"></script>
  <script src="js/bots.js"></script>
  <script>
    let currentUser = null;
    let gameId = null;
    let roomId = null;
    let state = null; // local authoritative copy for bot mode or synced
    let mySeat = null;
    let channel = null;
    let isBotGame = false;
    let pendingWildCard = null;
    let botTimer = null;

    const params = new URLSearchParams(location.search);

    async function init() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      if (params.get('mode') === 'bots') {
        isBotGame = true;
        startBotGame();
        return;
      }

      gameId = params.get('game');
      roomId = params.get('room');
      if (!gameId) {
        showToast('No game', 'error');
        return;
      }
      await loadGame();
      subscribeGame();
    }

    async function startBotGame() {
      const count = parseInt(params.get('players') || '4');
      const diff = params.get('diff') || 'normal';
      const botNames = ['NOVA', 'BYTE', 'GLITCH', 'CIRCUIT', 'PIXEL'];

      const configs = [{
        seat: 0,
        userId: currentUser.user.id,
        username: currentUser.profile?.username || 'You',
        isBot: false
      }];

      for (let i = 1; i < count; i++) {
        configs.push({
          seat: i,
          userId: null,
          isBot: true,
          botName: botNames[i - 1],
          botDifficulty: diff,
          username: botNames[i - 1]
        });
      }

      state = UnoEngine.createInitialState(configs, {
        stackDraw: false, jumpIn: false, sevenO: false,
        forcePlay: false, drawUntilPlayable: false,
        allowDrawWithPlayable: true, startingHandSize: 7
      });
      mySeat = 0;
      render();
      maybeBotTurn();
    }

    async function loadGame() {
      const { data: game } = await sb.from('games').select('*').eq('id', gameId).single();
      if (!game) {
        showToast('Game not found', 'error');
        return;
      }

      const { data: gps } = await sb.from('game_players').select('*').eq('game_id', gameId).order('seat');

      // Build state
      state = {
        players: gps.map(gp => ({
          seat: gp.seat,
          userId: gp.user_id,
          username: gp.bot_name || 'Player',
          isBot: gp.is_bot,
          botName: gp.bot_name,
          botDifficulty: gp.bot_difficulty,
          hand: gp.user_id === currentUser.user.id ? (gp.hand || []) : [], // only own hand
          cardCount: gp.card_count,
          unoCalled: gp.uno_called
        })),
        drawPile: game.draw_pile || [],
        discardPile: game.discard_pile || [],
        currentColor: game.current_color,
        currentSeat: game.current_seat,
        direction: game.direction,
        pendingDraw: 0,
        status: game.status,
        rules: game.rules || {},
        lastAction: game.last_action
      };

      // Fetch usernames
      for (const p of state.players) {
        if (p.userId && !p.isBot) {
          const { data: prof } = await sb.from('profiles').select('username').eq('id', p.userId).single();
          if (prof) p.username = prof.username;
        }
      }

      mySeat = state.players.find(p => p.userId === currentUser.user.id)?.seat ?? 0;

      // Load own full hand
      const me = gps.find(g => g.user_id === currentUser.user.id);
      if (me) {
        state.players.find(p => p.seat === mySeat).hand = me.hand || [];
      }

      render();
      if (game.status === 'finished') showVictory();
    }

    function subscribeGame() {
      channel = sb.channel(`game:${gameId}`)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${gameId}` }, payload => {
          const g = payload.new;
          state.currentSeat = g.current_seat;
          state.currentColor = g.current_color;
          state.direction = g.direction;
          state.discardPile = g.discard_pile;
          state.drawPile = g.draw_pile;
          state.status = g.status;
          state.lastAction = g.last_action;
          if (g.status === 'finished') {
            state.winnerSeat = g.winner_seat;
            showVictory();
          }
          render();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_players', filter: `game_id=eq.${gameId}` }, async () => {
          // Refresh card counts and own hand
          const { data: gps } = await sb.from('game_players').select('*').eq('game_id', gameId);
          for (const gp of gps) {
            const p = state.players.find(x => x.seat === gp.seat);
            if (p) {
              p.cardCount = gp.card_count;
              p.unoCalled = gp.uno_called;
              if (gp.user_id === currentUser.user.id) {
                p.hand = gp.hand || [];
              }
            }
          }
          render();
        })
        .subscribe();
    }

    function render() {
      if (!state) return;

      // Opponents
      const oppEl = document.getElementById('opponents');
      oppEl.innerHTML = state.players
        .filter(p => p.seat !== mySeat)
        .map(p => `
          <div class="opponent ${p.seat === state.currentSeat ? 'active-turn' : ''}">
            <div class="name">${p.username}${p.unoCalled ? ' UNO!' : ''}</div>
            <div class="cards-count">${p.cardCount}</div>
          </div>
        `).join('');

      // Discard
      const top = state.discardPile[state.discardPile.length - 1];
      const disc = document.getElementById('discardPile');
      if (top) {
        disc.className = `pile discard-pile ${top.color || 'wild'}`;
        disc.innerHTML = `<span class="value">${formatValue(top)}</span>`;
        disc.style.borderColor = top.color ? `var(--${top.color === 'yellow' ? 'yellow' : top.color})` : 'var(--purple)';
        disc.style.color = top.color === 'yellow' || top.color === 'green' ? '#000' : '#fff';
      }

      // Color indicator
      const ind = document.getElementById('colorInd');
      ind.style.background = state.currentColor || '#888';
      ind.style.color = state.currentColor;

      // Turn info
      const cur = state.players.find(p => p.seat === state.currentSeat);
      document.getElementById('turnInfo').textContent = 
        state.currentSeat === mySeat ? 'YOUR TURN' : `${cur?.username || 'Player'}'s turn`;

      // Hand
      const handEl = document.getElementById('hand');
      const me = state.players.find(p => p.seat === mySeat);
      const playable = state.currentSeat === mySeat 
        ? UnoEngine.getPlayableCards(me.hand, top, state.currentColor, state.rules)
        : [];

      handEl.innerHTML = (me.hand || []).map((c, idx) => {
        const canPlay = playable.includes(c) || playable.some(p => p.value === c.value && p.color === c.color);
        return `<div class="card ${c.color || c.value} ${canPlay ? 'playable' : ''}" 
                    onclick="playCard(${idx})" data-idx="${idx}">
                  <span class="value">${formatValue(c)}</span>
                </div>`;
      }).join('');

      // UNO button
      const unoBtn = document.getElementById('unoBtn');
      if (me.hand.length === 1 && !me.unoCalled && state.currentSeat === mySeat) {
        unoBtn.classList.add('show');
      } else {
        unoBtn.classList.remove('show');
      }
    }

    function formatValue(c) {
      if (c.value === 'draw2') return '+2';
      if (c.value === 'wild4') return '+4';
      if (c.value === 'skip') return '⊘';
      if (c.value === 'reverse') return '⇄';
      if (c.value === 'wild') return 'W';
      return c.value;
    }

    async function playCard(idx) {
      if (state.currentSeat !== mySeat || state.status !== 'active') return;
      const me = state.players.find(p => p.seat === mySeat);
      const card = me.hand[idx];
      const top = state.discardPile[state.discardPile.length - 1];

      if (!UnoEngine.isPlayable(card, top, state.currentColor, state.rules)) {
        showToast('Cannot play that card', 'error');
        return;
      }

      if (card.type === 'wild') {
        pendingWildCard = { card, idx };
        document.getElementById('colorPicker').classList.remove('hidden');
        return;
      }

      await executePlay(card, null);
    }

    function chooseColor(color) {
      document.getElementById('colorPicker').classList.add('hidden');
      if (pendingWildCard) {
        executePlay(pendingWildCard.card, color);
        pendingWildCard = null;
      }
    }

    async function executePlay(card, color) {
      // Local update first for responsiveness
      let next = UnoEngine.applyCardEffect(card, state, color);
      next.players = next.players.map(p => {
        if (p.seat === mySeat) {
          const hand = p.hand.filter(c => c !== card);
          return { ...p, hand, cardCount: hand.length, unoCalled: hand.length === 1 ? p.unoCalled : false };
        }
        return p;
      });

      // Winner?
      const winSeat = UnoEngine.checkWinner(next);
      if (winSeat !== null) {
        next.status = 'finished';
        next.winnerSeat = winSeat;
      }

      state = next;
      render();

      if (isBotGame) {
        if (winSeat !== null) {
          showVictory();
          return;
        }
        maybeBotTurn();
        return;
      }

      // Persist to Supabase
      try {
        await sb.from('games').update({
          current_seat: state.currentSeat,
          current_color: state.currentColor,
          direction: state.direction,
          discard_pile: state.discardPile,
          draw_pile: state.drawPile,
          last_action: { type: 'play', card, seat: mySeat, color },
          status: state.status,
          winner_seat: state.winnerSeat,
          updated_at: new Date().toISOString()
        }).eq('id', gameId);

        await sb.from('game_players').update({
          hand: state.players.find(p => p.seat === mySeat).hand,
          card_count: state.players.find(p => p.seat === mySeat).cardCount,
          uno_called: state.players.find(p => p.seat === mySeat).unoCalled
        }).eq('game_id', gameId).eq('seat', mySeat);

        // Update other card counts is handled by their clients; for simplicity we also bump counts via last action
        if (state.status === 'finished') showVictory();
      } catch (e) {
        console.error(e);
        showToast('Sync error', 'error');
      }
    }

    async function onDraw() {
      if (state.currentSeat !== mySeat || state.status !== 'active') return;
      const me = state.players.find(p => p.seat === mySeat);
      const top = state.discardPile[state.discardPile.length - 1];
      const playable = UnoEngine.getPlayableCards(me.hand, top, state.currentColor, state.rules);

      if (playable.length && !state.rules.allowDrawWithPlayable) {
        showToast('You have a playable card', 'error');
        return;
      }

      let next = UnoEngine.drawCards(state, mySeat, 1);
      // Advance turn if not force play
      if (!state.rules.forcePlay) {
        const n = next.players.length;
        next.currentSeat = (mySeat + next.direction + n) % n;
      }
      state = next;
      render();

      if (isBotGame) {
        maybeBotTurn();
        return;
      }

      try {
        await sb.from('games').update({
          current_seat: state.currentSeat,
          draw_pile: state.drawPile,
          last_action: { type: 'draw', seat: mySeat },
          updated_at: new Date().toISOString()
        }).eq('id', gameId);

        await sb.from('game_players').update({
          hand: state.players.find(p => p.seat === mySeat).hand,
          card_count: state.players.find(p => p.seat === mySeat).cardCount
        }).eq('game_id', gameId).eq('seat', mySeat);
      } catch (e) {
        console.error(e);
      }
    }

    async function callUno() {
      const me = state.players.find(p => p.seat === mySeat);
      if (me.hand.length !== 1) return;
      me.unoCalled = true;
      document.getElementById('unoBtn').classList.remove('show');
      showToast(`${me.username} called UNO!`);
      render();

      if (!isBotGame) {
        await sb.from('game_players').update({ uno_called: true })
          .eq('game_id', gameId).eq('seat', mySeat);
      }
    }

    function maybeBotTurn() {
      clearTimeout(botTimer);
      if (state.status !== 'active') return;
      const cur = state.players.find(p => p.seat === state.currentSeat);
      if (!cur || !cur.isBot) return;

      botTimer = setTimeout(() => {
        const next = BotAI.runBotTurn(state, state.currentSeat);
        if (next) {
          state = next;
          const win = UnoEngine.checkWinner(state);
          if (win !== null) {
            state.status = 'finished';
            state.winnerSeat = win;
            render();
            showVictory();
            return;
          }
          render();
          maybeBotTurn();
        }
      }, 700 + Math.random() * 800);
    }

    function showVictory() {
      const winner = state.players.find(p => p.seat === state.winnerSeat);
      document.getElementById('winnerName').textContent = winner?.username || 'Someone';
      document.getElementById('victory').classList.remove('hidden');
    }

    init();
  </script>
</body>
</html>
