<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Register // UghKnow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1 class="glitch">UghKnow</h1>
      <div class="tagline">CREATE IDENTITY</div>
    </div>

    <div class="panel">
      <h2 class="neon-text text-center mb-1" style="font-size:1.2rem;">REGISTER</h2>
      
      <form id="regForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" placeholder="3-20 chars, letters/numbers/_">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="password2" autocomplete="new-password" required minlength="6" placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-primary" id="regBtn">CREATE ACCOUNT</button>
      </form>

      <p class="text-center mt-2" style="font-size:0.85rem;color:var(--text-dim);">
        Already have an account? <a href="login.html" style="color:var(--cyan);">Login</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1 !== p2) {
        showToast('Passwords do not match', 'error');
        return;
      }
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = 'CREATING...';
      try {
        await register(u, p1);
        showToast('Account created! Logging in...');
        // Auto login
        await login(u, p1);
        setTimeout(() => location.href = 'dashboard.html', 500);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'CREATE ACCOUNT';
      }
    });
  </script>
</body>
</html>
