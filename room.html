<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Room // UghKnow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="logo" style="margin-bottom:0.5rem;">
      <h1 style="font-size:1.4rem;">PRIVATE ROOM</h1>
    </div>

    <div id="createPanel" class="panel hidden">
      <h3 class="neon-text text-center">CREATE ROOM</h3>
      <div class="form-group">
        <label>Players</label>
        <select id="maxPlayers">
          <option value="2">2 Players</option>
          <option value="4" selected>4 Players</option>
          <option value="6">6 Players</option>
        </select>
      </div>
      <h4 style="font-size:0.85rem;margin:1rem 0 0.5rem;color:var(--text-dim);">HOUSE RULES</h4>
      <div id="rulesToggles"></div>
      <button class="btn btn-primary mt-2" onclick="createRoom()">CREATE ROOM</button>
      <button class="btn btn-sm mt-1" onclick="location.href='dashboard.html'">BACK</button>
    </div>

    <div id="lobbyPanel" class="panel hidden">
      <p class="text-center" style="color:var(--text-dim);font-size:0.8rem;">ROOM CODE</p>
      <div class="room-code" id="roomCodeDisplay">------</div>
      <div class="flex gap-1 mt-1" style="justify-content:center;">
        <button class="btn btn-sm" onclick="copyCode()">COPY CODE</button>
        <button class="btn btn-sm" onclick="copyLink()">COPY LINK</button>
      </div>

      <div class="player-slots" id="playerSlots"></div>

      <div id="hostControls" class="hidden">
        <button class="btn btn-primary" id="startBtn" onclick="startGame()" disabled>START GAME</button>
      </div>
      <button class="btn btn-danger mt-1" onclick="leaveRoom()">LEAVE ROOM</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/uno-engine.js"></script>
  <script>
    let currentUser = null;
    let room = null;
    let players = [];
    let channel = null;
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    const codeParam = params.get('code');

    const defaultRules = {
      stackDraw: false,
      jumpIn: false,
      sevenO: false,
      forcePlay: false,
      drawUntilPlayable: false,
      allowDrawWithPlayable: true,
      startingHandSize: 7
    };

    const ruleLabels = {
      stackDraw: 'Stack Draw Cards',
      jumpIn: 'Jump-In',
      sevenO: 'Seven-O',
      forcePlay: 'Force Play Drawn Card',
      drawUntilPlayable: 'Draw Until Playable',
      allowDrawWithPlayable: 'Allow Draw with Playable Card'
    };

    async function init() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      if (mode === 'create') {
        showCreate();
      } else if (codeParam) {
        await joinExisting(codeParam);
      } else {
        location.href = 'dashboard.html';
      }
    }

    function showCreate() {
      document.getElementById('createPanel').classList.remove('hidden');
      const container = document.getElementById('rulesToggles');
      container.innerHTML = Object.entries(ruleLabels).map(([key, label]) => `
        <div class="toggle-row">
          <span style="font-size:0.85rem;">${label}</span>
          <div class="toggle ${defaultRules[key] ? 'on' : ''}" data-rule="${key}" onclick="this.classList.toggle('on')"></div>
        </div>
      `).join('');
    }

    function getSelectedRules() {
      const rules = { ...defaultRules };
      document.querySelectorAll('#rulesToggles .toggle').forEach(el => {
        rules[el.dataset.rule] = el.classList.contains('on');
      });
      return rules;
    }

    async function createRoom() {
      const max = parseInt(document.getElementById('maxPlayers').value);
      const rules = getSelectedRules();
      try {
        const { data, error } = await sb.rpc('create_private_room', {
          p_max_players: max,
          p_rules: rules
        });
        if (error) throw error;
        location.href = `room.html?code=${data.room_code}`;
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function joinExisting(code) {
      try {
        const { data, error } = await sb.rpc('join_room_by_code', { p_code: code });
        if (error) throw error;
        await loadRoom(data.room_code);
      } catch (e) {
        showToast(e.message || 'Failed to join', 'error');
        setTimeout(() => location.href = 'dashboard.html', 2000);
      }
    }

    async function loadRoom(code) {
      const { data: r, error } = await sb.from('rooms').select('*').eq('room_code', code).single();
      if (error || !r) {
        showToast('Room not found', 'error');
        return;
      }
      room = r;
      document.getElementById('createPanel').classList.add('hidden');
      document.getElementById('lobbyPanel').classList.remove('hidden');
      document.getElementById('roomCodeDisplay').textContent = room.room_code;

      if (room.host_id === currentUser.user.id) {
        document.getElementById('hostControls').classList.remove('hidden');
      }

      await refreshPlayers();
      subscribeRoom();

      // Auto start if matchmaking and full
      if (params.get('auto') && room.status === 'waiting') {
        const tryAutoStart = async () => {
          await refreshPlayers();
          if (players.length >= room.max_players && room.host_id === currentUser.user.id) {
            startGame();
          } else if (room.host_id === currentUser.user.id) {
            setTimeout(tryAutoStart, 1500);
          }
        };
        setTimeout(tryAutoStart, 1500);
      }
    }

    async function refreshPlayers() {
      const { data } = await sb
        .from('room_players')
        .select('*, profiles(username)')
        .eq('room_id', room.id)
        .neq('status', 'left')
        .order('seat');

      players = data || [];
      renderSlots();

      const startBtn = document.getElementById('startBtn');
      if (startBtn) {
        startBtn.disabled = players.length < 2;
      }
    }

    function renderSlots() {
      const slots = document.getElementById('playerSlots');
      let html = '';
      for (let i = 0; i < room.max_players; i++) {
        const p = players.find(x => x.seat === i);
        if (p) {
          const name = p.is_bot ? (p.bot_name || 'BOT') : (p.profiles?.username || 'Player');
          const isHost = p.user_id === room.host_id;
          html += `
            <div class="player-slot filled">
              <div class="avatar" style="width:36px;height:36px;">${name[0]}</div>
              <span>${name}</span>
              ${isHost ? '<span class="host-badge">HOST</span>' : ''}
            </div>`;
        } else {
          html += `
            <div class="player-slot">
              <div class="avatar" style="width:36px;height:36px;opacity:0.3;">?</div>
              <span style="color:var(--text-dim);">Waiting...</span>
            </div>`;
        }
      }
      slots.innerHTML = html;
    }

    function subscribeRoom() {
      channel = sb.channel(`room:${room.id}`)
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'room_players',
          filter: `room_id=eq.${room.id}`
        }, () => refreshPlayers())
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'rooms',
          filter: `id=eq.${room.id}`
        }, payload => {
          room = payload.new;
          if (room.status === 'playing' && room.current_game_id) {
            location.href = `game.html?game=${room.current_game_id}&room=${room.id}`;
          }
        })
        .subscribe();
    }

    async function startGame() {
      if (players.length < 2) {
        showToast('Need at least 2 players', 'error');
        return;
      }
      try {
        // Create game state client-side then store
        const playerConfigs = players.map(p => ({
          seat: p.seat,
          userId: p.user_id,
          isBot: p.is_bot,
          botName: p.bot_name,
          botDifficulty: p.bot_difficulty,
          username: p.profiles?.username || p.bot_name || 'Player'
        }));

        const state = UnoEngine.createInitialState(playerConfigs, room.game_rules || defaultRules);

        const { data: game, error } = await sb.from('games').insert({
          room_id: room.id,
          status: 'active',
          current_seat: state.currentSeat,
          current_color: state.currentColor,
          direction: state.direction,
          discard_pile: state.discardPile,
          draw_pile: state.drawPile,
          rules: state.rules,
          last_action: state.lastAction
        }).select().single();

        if (error) throw error;

        // Insert game_players with hands
        const gpInserts = state.players.map(p => ({
          game_id: game.id,
          user_id: p.userId,
          seat: p.seat,
          hand: p.hand,
          card_count: p.cardCount,
          is_bot: p.isBot,
          bot_name: p.botName,
          bot_difficulty: p.botDifficulty
        }));
        await sb.from('game_players').insert(gpInserts);

        // Update room
        await sb.from('rooms').update({
          status: 'playing',
          current_game_id: game.id
        }).eq('id', room.id);

        location.href = `game.html?game=${game.id}&room=${room.id}`;
      } catch (e) {
        console.error(e);
        showToast(e.message || 'Failed to start', 'error');
      }
    }

    async function leaveRoom() {
      if (!room) {
        location.href = 'dashboard.html';
        return;
      }
      await sb.from('room_players').update({ status: 'left' }).eq('room_id', room.id).eq('user_id', currentUser.user.id);
      // Host transfer if needed
      if (room.host_id === currentUser.user.id) {
        const remaining = players.filter(p => p.user_id !== currentUser.user.id && !p.is_bot);
        if (remaining.length) {
          await sb.from('rooms').update({ host_id: remaining[0].user_id }).eq('id', room.id);
        } else {
          await sb.from('rooms').update({ status: 'cancelled' }).eq('id', room.id);
        }
      }
      if (channel) sb.removeChannel(channel);
      location.href = 'dashboard.html';
    }

    function copyCode() {
      navigator.clipboard.writeText(room.room_code);
      showToast('Code copied');
    }

    function copyLink() {
      const url = `${location.origin}${location.pathname.replace('room.html', 'dashboard.html')}?join=${room.room_code}`;
      // Better: use the repo base
      const base = location.href.split('/').slice(0, -1).join('/');
      const link = `${base}/dashboard.html?join=${room.room_code}`;
      navigator.clipboard.writeText(link);
      showToast('Link copied');
    }

    init();
  </script>
</body>
</html>
